<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <title>Acasystem</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body data-view="loading">
    <main class="card aca-m aca-raised aca-card aca-md aca-m--static aca-m--card aca-m--md">
      <div class="aca-m__outer"><div class="aca-m__face"><div class="aca-m__content shell-content">
      <img class="logo" src="icon.png" alt="" width="72" height="72" />
      <h1 class="aca-type aca-type--title">Acasystem</h1>

      <section class="view view-loading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-message">Avvio in corso…</p>
      </section>

      <section class="view view-wizard">
        <p class="lead">Collega ACA al mini PC della tua casa.</p>
        <form id="wizard-form" novalidate>
          <p>Inserisci l’indirizzo IP oppure incolla il collegamento della centrale.</p>
          <label class="shell-label aca-type aca-type--label-sm" for="host">Indirizzo IP</label>
          <label class="shell-field aca-m aca-well aca-pill aca-md aca-m--well aca-m--pill aca-m--md aca-field" for="host"><span class="aca-m__outer"><span class="aca-m__face"><span class="aca-m__content aca-field__content"><input class="aca-field__input" id="host" name="host" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.1.184" required /></span></span></span></label>
          <details>
            <summary>Impostazioni avanzate</summary>
            <label class="shell-label aca-type aca-type--label-sm" for="port">Porta di Acasystem</label>
            <label class="shell-field aca-m aca-well aca-pill aca-md aca-m--well aca-m--pill aca-m--md aca-field" for="port"><span class="aca-m__outer"><span class="aca-m__face"><span class="aca-m__content aca-field__content"><input class="aca-field__input" id="port" name="port" inputmode="numeric" autocomplete="off" placeholder="3002" /></span></span></span></label>
          </details>
          <p id="wizard-message" class="message" role="alert"></p>
          <button id="submit" type="submit" class="primary aca-m aca-raised aca-pill aca-lg aca-fx-press aca-fx-hover-light aca-m--press aca-m--pill aca-m--lg aca-m--primary"><span class="aca-m__outer"><span class="aca-m__face"><span class="aca-m__content"><span class="aca-m__label">Collega</span></span></span></span></button>
        </form>
      </section>

      <section class="view view-error view-fatal">
        <p id="error-message" class="message" role="alert"></p>
        <div class="actions">
          <button id="retry" type="button" class="primary aca-m aca-raised aca-pill aca-lg aca-fx-press aca-fx-hover-light aca-m--press aca-m--pill aca-m--lg aca-m--primary"><span class="aca-m__outer"><span class="aca-m__face"><span class="aca-m__content"><span class="aca-m__label">Riprova</span></span></span></span></button>
          <button id="change-address" type="button" class="aca-m aca-raised aca-pill aca-lg aca-fx-press aca-fx-hover-light aca-m--press aca-m--pill aca-m--lg aca-m--quiet"><span class="aca-m__outer"><span class="aca-m__face"><span class="aca-m__content"><span class="aca-m__label">Cambia indirizzo</span></span></span></span></button>
        </div>
      </section>

      <p id="version" class="version"></p>
      </div></div></div>
    </main>
    <script src="../build/windows/src/renderer/shell.js"></script>
  </body>
</html>

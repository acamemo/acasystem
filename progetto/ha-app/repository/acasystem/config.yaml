# Acasystem come app di HA OS (REP-20261026-005). `version` è il tag dell'immagine:
# si alza solo DOPO aver pubblicato ghcr.io/acamemo/acasystem:<versione>.
name: Acasystem
version: "__VERSION__"
slug: acasystem
description: Interfaccia Acasystem per Home Assistant, per le app Acasystem di Windows e Android.
url: https://github.com/acamemo/acasystem-releases
arch:
  - amd64
image: ghcr.io/acamemo/acasystem
init: true
startup: application
boot: auto
# hassio_api: lettura della porta di HA (GET /core/info).
# homeassistant_api: il Supervisor dà all'app SUPERVISOR_TOKEN per il proxy verso Core
# (http://supervisor/core/api, ws://supervisor/core/websocket). Serve SOLO a creare, rinnovare e
# riattivare da sola l'utente «Acasystem (servizio)»; le operazioni passano da quell'utente
# (ADR-0022, annotazione 2026-10-28; REP-20261028-004).
hassio_api: true
homeassistant_api: true
ingress: false
ports:
  3002/tcp: 3002
ports_description:
  3002/tcp: Acasystem (app per Windows e Android)
watchdog: "http://[HOST]:[PORT:3002]/api/health"
backup: cold
# Il file dell'utente di servizio (ADR-0022) non entra nei backup.
backup_exclude:
  - "service-secret"
  - "service-secret/*"
options: {}
schema: {}

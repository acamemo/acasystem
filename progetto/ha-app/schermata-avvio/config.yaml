# Schermata di avvio della centrale ACA (REP-20261118-001, REQ-29).
# Mostra a schermo intero sull'uscita video istruzioni, QR del solo URL della centrale e indirizzo IP.
# Prova tecnica: full_access è provvisorio finché non si conoscono i dispositivi strettamente necessari.
name: Schermata Acasystem
version: "0.2.0"
slug: aca_schermata
description: Schermata di avvio con QR code e indirizzo della centrale sull'uscita video.
arch:
  - amd64
startup: services
boot: auto
init: false
host_network: true
full_access: true
video: true
udev: true
# Prova tecnica: il profilo AppArmor predefinito nega l'apertura dei terminali virtuali (tty0/tty1).
apparmor: false
privileged:
  - SYS_ADMIN
options: {}
schema: {}
